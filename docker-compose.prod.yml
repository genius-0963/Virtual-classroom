services:
  db:
    image: mysql:8.0
    container_name: virtual_classroom_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mypasswordis2425}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project}
      MYSQL_USER: ${MYSQL_USER:-vclass_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-VClassSecret2026!}
    volumes:
      - ./project_DB.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Mypasswordis2425}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual_classroom_web
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-vclass_user}
      DB_PASSWORD: ${DB_PASSWORD:-VClassSecret2026!}
      DB_NAME: ${DB_NAME:-project}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: virtual_classroom_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  mysql_data:
